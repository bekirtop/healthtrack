name: patient_tracking_app
description: Hasta Taburcu Takip Sistemi Mobil Uygulamasi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Bizim Eklediğimiz Paketler ---
  
  # API İstekleri için (HTTP yerine daha gelişmiş)
  dio: ^5.4.0
  
  # State Management (Veri Yönetimi)
  provider: ^6.1.1
  
  # Token saklamak için (Giriş yapınca token'ı buraya atacağız)
  shared_preferences: ^2.2.2
  
  # JWT Token içindeki veriyi okumak için
  jwt_decoder: ^2.0.1
  
  # Tarih formatlama (25 Kasım 2025 gibi yazmak için)
  intl: ^0.19.0
  
  # Google Fontları
  google_fonts: ^6.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true